name: Supabase Keep Alive

on:
  schedule:
    # Ejecutar cada 2 días a las 10:00 AM UTC
    - cron: '0 10 */2 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_URL o SUPABASE_ANON_KEY no están definidos en GitHub Secrets."
            exit 1
          fi
          
          echo "Haciendo ping a Supabase para evitar el modo stand-by..."
          curl -s -o /dev/null -w "%{http_code}" -X GET "$SUPABASE_URL/rest/v1/tournament_state?limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          
          echo -e "\nPing completado exitosamente."
