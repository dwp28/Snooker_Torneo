# ============================================================
# keep_supabase_alive.yml
# Evita que el proyecto de Supabase (plan gratuito) entre en
# pausa por inactividad haciendo una petición de lectura simple
# a la REST API dos veces por semana.
# ============================================================

name: Keep Supabase Alive

on:
  # Permite ejecutarlo manualmente desde GitHub Actions → "Run workflow"
  workflow_dispatch:

  # Se ejecuta automáticamente los martes y viernes a las 00:00 UTC
  schedule:
    - cron: "0 0 * * 2,5"

jobs:
  ping-supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase — petición de lectura simple
        run: |
          echo "🏓 Haciendo ping a Supabase para evitar la pausa por inactividad..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "📡 HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase responde correctamente (HTTP $HTTP_STATUS). ¡Base de datos activa!"
          else
            echo "⚠️ Respuesta inesperada de Supabase: HTTP $HTTP_STATUS"
            exit 1
          fi
